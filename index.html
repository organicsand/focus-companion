<!DOCTYPE html>
<html lang="ko" data-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집중 컴패니언</title>
<style>
  :root {
    --bg: #f5f1e8; --panel: #ebe5d8; --ink: #211e1a; --dim: #7a7266;
    --line: #d6cebe; --accent: #c04f36; --on-accent: #fff8f2; --rest: #2f7a6b;
  }
  [data-mode="dark"] {
    --bg: #191816; --panel: #24221f; --ink: #ede8dd; --dim: #948c7f;
    --line: #36332e; --accent: #ea8469; --on-accent: #1d1210; --rest: #6cc3b0;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font: 13px/1.3 system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
    overflow: hidden;
  }
  .wrap {
    width: 100%; height: 100%; max-width: 440px; max-height: 420px;
    margin: 0 auto; padding: 12px;
    display: flex; flex-direction: column; gap: 7px;
    position: relative; top: 50%; transform: translateY(-50%);
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

  /* 목표 / 안내 */
  .top { position: relative; height: 28px; flex: none; }
  .goal {
    width: 100%; height: 100%; padding: 0 9px;
    background: transparent; border: 0; border-bottom: 1px solid var(--line);
    border-radius: 0; min-width: 0;
  }
  .goal::placeholder { color: var(--dim); }
  .goal:focus { outline: none; border-bottom-color: var(--accent); }
  .notice {
    position: absolute; inset: 0; display: none; align-items: center; gap: 6px;
    padding: 0 4px 0 9px; border-radius: 6px;
    background: var(--accent); color: var(--on-accent); font-weight: 600;
  }
  .notice.on { display: flex; }
  .notice span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .notice button {
    flex: none; height: 22px; padding: 0 8px; border-radius: 4px;
    color: var(--on-accent); border: 1px solid currentColor; font-size: 12px;
  }

  /* 시계 */
  .clock {
    flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .time {
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums; font-weight: 600; letter-spacing: -0.04em;
    font-size: clamp(38px, 24vmin, 104px); line-height: 1;
    user-select: text;
  }
  .break .time { color: var(--rest); }
  .step {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    border: 1px solid var(--line); color: var(--dim); font-size: 15px; line-height: 1;
  }
  .step:hover { color: var(--ink); border-color: var(--dim); }
  .running .step, .paused .step { visibility: hidden; }

  .bar { height: 3px; flex: none; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); }
  .break .bar i { background: var(--rest); }

  /* 조작 */
  .ctl { display: flex; gap: 6px; flex: none; height: 30px; }
  .seg { display: flex; flex: none; background: var(--panel); border-radius: 7px; padding: 2px; }
  .seg button { padding: 0 9px; border-radius: 5px; color: var(--dim); white-space: nowrap; }
  .seg button[aria-pressed="true"] { background: var(--bg); color: var(--ink); font-weight: 600; }
  .go {
    flex: 1; min-width: 0; border-radius: 7px; font-weight: 700;
    background: var(--accent); color: var(--on-accent); white-space: nowrap;
  }
  .break .go { background: var(--rest); }
  .reset { flex: none; width: 30px; border-radius: 7px; background: var(--panel); color: var(--dim); font-size: 15px; }
  .reset:hover { color: var(--ink); }

  /* 하단 */
  .foot { display: flex; align-items: center; gap: 8px; flex: none; height: 18px; color: var(--dim); font-size: 11px; }
  .dots { display: flex; gap: 4px; align-items: center; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); flex: none; }
  .foot button { color: var(--dim); font-size: 11px; padding: 2px 4px; border-radius: 4px; }
  .foot button:hover { color: var(--ink); }

  @media (max-height: 190px) { .foot { display: none; } }
</style>
</head>
<body>
<main class="wrap" id="app">
  <div class="top">
    <input class="goal" id="goal" type="text" maxlength="60" autocomplete="off">
    <div class="notice" id="notice" role="status" aria-live="polite">
      <span id="noticeText"></span>
      <button type="button" id="noticeOk"></button>
    </div>
  </div>

  <div class="clock">
    <button class="step" id="minus" type="button">−</button>
    <div class="time" id="time" role="timer">25:00</div>
    <button class="step" id="plus" type="button">+</button>
  </div>
  <div class="bar"><i id="fill"></i></div>

  <div class="ctl">
    <div class="seg" role="group">
      <button type="button" id="segFocus"></button>
      <button type="button" id="segBreak"></button>
    </div>
    <button class="go" id="go" type="button"></button>
    <button class="reset" id="reset" type="button">↺</button>
  </div>

  <div class="foot">
    <div class="dots" id="dots"></div>
    <button type="button" id="langBtn"></button>
    <button type="button" id="modeBtn">◐</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  // ---- 저장소: 막혀 있어도 그대로 동작 ----
  var KEY = 'focus-companion-v1';
  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

  // ---- 문구 ----
  var T = {
    ko: {
      goal: '지금 할 일 한 가지', focus: '집중', rest: '휴식',
      start: '시작', pause: '잠시 멈춤', resume: '이어서', reset: '처음으로',
      minus: '5분 줄이기', plus: '5분 늘리기', ok: '확인',
      today: '오늘 ', none: '오늘 첫 집중을 시작해 보세요', lang: 'EN', mode: '밝게/어둡게',
      doneFocus: function (m) { return '집중 ' + m + '분 끝! 잠깐 쉬어요'; },
      doneRest: '휴식 끝. 다시 집중해 볼까요?',
      msgFocus: function (g, n) { return (g ? '「' + g + '」 · ' : '') + '오늘 ' + n + '번째 집중을 마쳤습니다.'; },
      msgRest: '다음 집중을 시작할 시간입니다.'
    },
    en: {
      goal: 'One thing to do now', focus: 'Focus', rest: 'Break',
      start: 'Start', pause: 'Pause', resume: 'Resume', reset: 'Reset',
      minus: '5 minutes less', plus: '5 minutes more', ok: 'OK',
      today: 'Today ', none: 'Start your first focus of the day', lang: '한', mode: 'Light/dark',
      doneFocus: function (m) { return m + '-min focus done. Take a break'; },
      doneRest: 'Break over. Back to focus?',
      msgFocus: function (g, n) { return (g ? '"' + g + '" · ' : '') + 'Focus session ' + n + ' of today finished.'; },
      msgRest: 'Time to start the next focus session.'
    }
  };

  // ---- 상태 ----
  var S = load();
  S.dur = S.dur || { focus: 25, break: 5 };
  S.phase = S.phase === 'break' ? 'break' : 'focus';
  S.goal = S.goal || '';
  S.done = S.done || { date: '', count: 0 };
  if (typeof S.remain !== 'number') S.remain = S.dur[S.phase] * 60000;

  var q = new URLSearchParams(location.search);
  var lang = q.get('lang') || S.lang || ((navigator.language || 'ko').slice(0, 2) === 'ko' ? 'ko' : 'en');
  if (lang !== 'ko' && lang !== 'en') lang = 'ko';
  var mode = q.get('mode') || S.mode || '';
  if (mode !== 'light' && mode !== 'dark') {
    mode = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }

  var $ = function (id) { return document.getElementById(id); };
  var app = $('app'), notice = null;

  function today() {
    var d = new Date();
    return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
  }
  function count() { return S.done.date === today() ? S.done.count : 0; }
  function left() { return S.endAt ? Math.max(0, S.endAt - Date.now()) : S.remain; }
  function total() { return S.dur[S.phase] * 60000; }

  // ---- Myzard 수신함으로 소식 보내기 (카드 안에 있을 때만) ----
  function notify(title, message, key) {
    if (window.parent === window) return;
    try {
      window.parent.postMessage({
        myzard: 1, type: 'event',
        title: String(title).slice(0, 80),
        message: String(message).slice(0, 300),
        level: 'info', key: String(key).slice(0, 64)
      }, '*');
    } catch (e) {}
  }

  function finish() {
    var t = T[lang], was = S.phase, mins = S.dur[was];
    if (was === 'focus') {
      S.done = { date: today(), count: count() + 1 };
      notice = { k: 'f', m: mins };
      notify(t.doneFocus(mins), t.msgFocus(S.goal, S.done.count), 'focus-' + S.endAt);
    } else {
      notice = { k: 'r' };
      notify(t.doneRest, t.msgRest, 'rest-' + S.endAt);
    }
    S.phase = was === 'focus' ? 'break' : 'focus';
    S.endAt = null;
    S.remain = total();
    save(); render();
  }

  function fmt(ms) {
    var s = Math.ceil(ms / 1000), m = Math.floor(s / 60);
    s = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
  }

  function tick() {
    if (S.endAt && Date.now() >= S.endAt) { finish(); return; }
    var l = left();
    $('time').textContent = fmt(l);
    $('fill').style.width = (100 * (1 - l / total())).toFixed(2) + '%';
  }

  function render() {
    var t = T[lang], running = !!S.endAt, paused = !running && S.remain < total();
    document.documentElement.lang = lang;
    document.documentElement.setAttribute('data-mode', mode);
    document.title = lang === 'ko' ? '집중 컴패니언' : 'Focus Companion';
    app.className = 'wrap ' + S.phase + (running ? ' running' : paused ? ' paused' : '');

    $('goal').placeholder = t.goal;
    $('goal').setAttribute('aria-label', t.goal);
    if (document.activeElement !== $('goal')) $('goal').value = S.goal;

    $('segFocus').textContent = t.focus;
    $('segBreak').textContent = t.rest;
    $('segFocus').setAttribute('aria-pressed', S.phase === 'focus');
    $('segBreak').setAttribute('aria-pressed', S.phase === 'break');
    $('go').textContent = running ? t.pause : paused ? t.resume : t.start;
    $('reset').setAttribute('aria-label', t.reset); $('reset').title = t.reset;
    $('minus').setAttribute('aria-label', t.minus);
    $('plus').setAttribute('aria-label', t.plus);
    $('langBtn').textContent = t.lang;
    $('modeBtn').setAttribute('aria-label', t.mode); $('modeBtn').title = t.mode;
    $('noticeOk').textContent = t.ok;

    $('notice').className = 'notice' + (notice ? ' on' : '');
    $('noticeText').textContent = !notice ? '' : notice.k === 'f' ? t.doneFocus(notice.m) : t.doneRest;

    var n = count(), dots = $('dots');
    dots.textContent = '';
    if (!n) { dots.textContent = t.none; }
    else {
      dots.appendChild(document.createTextNode(t.today));
      for (var i = 0; i < Math.min(n, 8); i++) dots.appendChild(document.createElement('i'));
      if (n > 8) dots.appendChild(document.createTextNode('+' + (n - 8)));
    }
    tick();
  }

  // ---- 조작 ----
  $('go').onclick = function () {
    notice = null;
    if (S.endAt) { S.remain = left(); S.endAt = null; }
    else { S.endAt = Date.now() + S.remain; }
    save(); render();
  };
  $('reset').onclick = function () {
    notice = null; S.endAt = null; S.remain = total(); save(); render();
  };
  function setPhase(p) {
    if (S.phase === p && !S.endAt) return;
    notice = null; S.phase = p; S.endAt = null; S.remain = total(); save(); render();
  }
  $('segFocus').onclick = function () { setPhase('focus'); };
  $('segBreak').onclick = function () { setPhase('break'); };
  function step(d) {
    var v = Math.min(90, Math.max(5, S.dur[S.phase] + d));
    S.dur[S.phase] = v; S.remain = total(); save(); render();
  }
  $('minus').onclick = function () { step(-5); };
  $('plus').onclick = function () { step(5); };
  $('goal').oninput = function () { S.goal = this.value.trim(); save(); };
  $('noticeOk').onclick = function () { notice = null; render(); };
  $('langBtn').onclick = function () { lang = lang === 'ko' ? 'en' : 'ko'; S.lang = lang; save(); render(); };
  $('modeBtn').onclick = function () { mode = mode === 'dark' ? 'light' : 'dark'; S.mode = mode; save(); render(); };

  render();
  setInterval(tick, 250);
  document.addEventListener('visibilitychange', tick);
})();
</script>
</body>
</html>
